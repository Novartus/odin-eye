name: Deploy OdinEye Launch Site to GitHub Pages

on:
  # Trigger automatically when changes are pushed to launch/ on main branch
  push:
    branches:
      - main
    paths:
      - 'launch/**'
      - '.github/workflows/deploy-pages.yml'

  # Allow manual trigger from the GitHub Actions UI tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (launch/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './launch'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
